name: Trigger auto deployment for gymtrack-training-plan

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/gymtrack-training-plan-AutoDeployTrigger-bafb574d-bd49-49eb-8d04-b3f4c80b6578.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GYMTRACKTRAININGPLAN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GYMTRACKTRAININGPLAN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GYMTRACKTRAININGPLAN_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}apps/api/training-plan
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.GYMTRACKTRAININGPLAN_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GYMTRACKTRAININGPLAN_REGISTRY_PASSWORD }}
          containerAppName: gymtrack-training-plan
          resourceGroup: gymtrack
          imageToBuild: kaiannn/gymtrack-training-plan:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


